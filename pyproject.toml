[project]
name = "genai-operations-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "pypdf>=5,<7", "python-multipart>=0.0.18,<1", "langgraph>=1,<2", "pydantic-settings>=2,<3", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3"]
ui = ["streamlit>=1.43,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
ignore_missing_imports = true
